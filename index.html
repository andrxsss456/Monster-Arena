<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Monster Arena</title>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
}

#app{
    display:flex;
    height:100vh;
}

#sidebar{
    width:320px;
    background:#1e293b;
    padding:20px;
    overflow:auto;
}

#battle{
    flex:1;
    padding:20px;
}

.panel{
    background:#334155;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.hpbar{
    height:25px;
    background:#111;
    border-radius:10px;
    overflow:hidden;
}

.hp{
    height:100%;
    background:#22c55e;
    transition:.3s;
}

.btn{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.btn:hover{
    background:#1d4ed8;
}

.monster{
    width:250px;
    height:250px;
    background:#334155;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

#arena{
    display:flex;
    justify-content:space-around;
    margin-top:40px;
}

#log{
    background:#111827;
    margin-top:20px;
    border-radius:10px;
    padding:10px;
    height:180px;
    overflow-y:auto;
}
</style>
</head>
<body>

<div id="app">

<div id="sidebar">

<div class="panel">
<h2>Jugador</h2>

Nivel: <span id="nivel"></span><br>
XP: <span id="xp"></span><br>
Oro: <span id="oro"></span><br>
Victorias: <span id="victorias"></span><br>

</div>

<div class="panel">

<h2>Equipo</h2>

<div id="equipo"></div>

</div>

</div>

<div id="battle">

<h1>MONSTER ARENA</h1>

<div id="arena">

<div>

<div class="monster">
🔥 HEROE
</div>

<div class="hpbar">
<div id="heroHp" class="hp"></div>
</div>

<p id="heroInfo"></p>

</div>

<div>

<div class="monster" id="enemySprite">
👾
</div>

<div class="hpbar">
<div id="enemyHp" class="hp"></div>
</div>

<p id="enemyInfo"></p>

</div>

</div>

<button class="btn" onclick="basicAttack()">
Ataque Básico
</button>

<button class="btn" onclick="specialAttack()">
Ataque Especial
</button>

<button class="btn" onclick="heal()">
Curar
</button>

<button class="btn" onclick="capture()">
Capturar
</button>

<div id="log"></div>

</div>

</div>

<script>

let player={
    level:1,
    xp:0,
    gold:0,
    wins:0,
    hp:120,
    maxHp:120,
    attack:20
};

let team=["Pyron"];

let enemy={};

const monsters=[
"Slime",
"Goblin",
"Lobo",
"Araña",
"Troll",
"Fantasma",
"Dragón",
"Serpiente"
];

function save(){
    localStorage.setItem(
        "monsterSave",
        JSON.stringify({
            player,
            team
        })
    );
}

function load(){

    let data=
    localStorage.getItem(
        "monsterSave"
    );

    if(data){

        let saveData=
        JSON.parse(data);

        player=
        saveData.player;

        team=
        saveData.team;
    }
}

function log(txt){

    document.getElementById("log")
    .innerHTML=
    txt+"<br>"+
    document.getElementById("log")
    .innerHTML;
}

function createEnemy(){

    let boss=
    player.wins>0 &&
    player.wins%10===0;

    if(boss){

        enemy={
            name:"JEFE",
            hp:400,
            maxHp:400,
            attack:35
        };

        log("¡Ha aparecido un jefe!");
    }
    else{

        enemy={
            name:
            monsters[
            Math.floor(
            Math.random()*
            monsters.length)
            ],
            hp:80+
            player.wins*5,
            maxHp:80+
            player.wins*5,
            attack:10+
            player.wins
        };
    }

    update();
}

function update(){

    nivel.textContent=
    player.level;

    xp.textContent=
    player.xp;

    oro.textContent=
    player.gold;

    victorias.textContent=
    player.wins;

    heroInfo.textContent=
    player.hp+
    "/" +
    player.maxHp;

    enemyInfo.textContent=
    enemy.name+
    " " +
    enemy.hp+
    "/" +
    enemy.maxHp;

    heroHp.style.width=
    (player.hp/
    player.maxHp)*100+"%";

    enemyHp.style.width=
    (enemy.hp/
    enemy.maxHp)*100+"%";

    equipo.innerHTML=
    team.join("<br>");
}

function enemyTurn(){

    let damage=
    enemy.attack+
    Math.floor(
    Math.random()*10);

    player.hp-=damage;

    log(
    enemy.name+
    " hace "+
    damage+
    " daño"
    );

    if(player.hp<=0){

        alert(
        "Game Over\nVictorias: "+
        player.wins
        );

        localStorage.clear();

        location.reload();
    }

    update();
}

function basicAttack(){

    let damage=
    player.attack+
    Math.floor(
    Math.random()*10);

    enemy.hp-=damage;

    log(
    "Ataque: "+
    damage
    );

    if(enemy.hp<=0){

        win();

        return;
    }

    enemyTurn();
}

function specialAttack(){

    let damage=
    player.attack*2+
    Math.floor(
    Math.random()*15);

    enemy.hp-=damage;

    log(
    "Ataque especial: "+
    damage
    );

    if(enemy.hp<=0){

        win();

        return;
    }

    enemyTurn();
}

function heal(){

    player.hp+=30;

    if(player.hp>
    player.maxHp)

    player.hp=
    player.maxHp;

    log(
    "Te curas 30 HP"
    );

    enemyTurn();
}

function capture(){

    let chance=
    Math.random();

    if(chance<0.30){

        if(team.length<6){

            team.push(
            enemy.name
            );
        }

        log(
        enemy.name+
        " capturado"
        );

        win();
    }
    else{

        log(
        "La captura falló"
        );

        enemyTurn();
    }
}

function reward(){

    let choice=
    Math.floor(
    Math.random()*3
    );

    if(choice===0){
        player.maxHp+=15;
    }

    if(choice===1){
        player.attack+=5;
    }

    if(choice===2){
        player.gold+=50;
    }
}

function win(){

    player.wins++;

    player.gold+=20;

    player.xp+=25;

    reward();

    if(player.xp>=100){

        player.xp-=100;

        player.level++;

        player.maxHp+=20;

        player.attack+=5;

        player.hp=
        player.maxHp;

        log(
        "SUBES A NIVEL "+
        player.level
        );
    }

    save();

    createEnemy();
}

load();
createEnemy();

</script
generarEnemigo();

</script>

</body>
</html>
